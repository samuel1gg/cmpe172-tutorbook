<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap narrow">
    <h1>Log in</h1>
    <div class="alert error" th:if="${param.error}">Wrong email or password.</div>
    <div class="alert ok" th:if="${param.logout}">You have been logged out.</div>
    <form class="form" th:action="@{/login}" method="post">
        <label>Email <input type="email" name="email" required autofocus></label>
        <label>Password <input type="password" name="password" required></label>
        <button class="btn" type="submit">Log in</button>
    </form>
    <div class="summary small">
        <p><span>Student</span><strong>alice@student.sjsu.edu / password123</strong></p>
        <p><span>Tutor</span><strong>j.kim@tutorbook.edu / password123</strong></p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
