<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book Appointment')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap narrow">
    <h1>Book appointment</h1>
    <div class="summary">
        <p><span>Tutor</span><strong th:text="${slot.providerName}">Tutor</strong></p>
        <p><span>Service</span><strong th:text="${slot.serviceName}">Service</strong></p>
        <p><span>When</span><strong th:text="${#temporals.format(slot.start, 'EEEE, MMMM d, yyyy h:mm a')} + ' (' + ${slot.durationMinutes} + ' min)'">When</strong></p>
        <p><span>Price</span><strong th:text="${slot.price}">$40.00</strong></p>
    </div>

    <form class="form" th:action="@{/slots/{id}/book(id=${slot.id})}" th:object="${bookingForm}" method="post">
        <label>Student <input type="text" th:value="${currentUser.fullName} + ' (' + ${currentUser.email} + ')'" disabled></label>
        <label>What do you want help with? (optional)
            <textarea th:field="*{notes}" rows="4" maxlength="600" placeholder="e.g. integration by parts, chapter 7"></textarea>
        </label>
        <p class="field-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}">error</p>
        <button class="btn" type="submit">Confirm booking</button>
    </form>
    <a th:href="@{/slots}">&larr; Back to slots</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
