<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | TutorBook'">TutorBook</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="header" class="site-header">
    <div class="wrap header-row">
        <a class="brand" th:href="@{/}">Tutor<span>Book</span></a>
        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/slots}">Available Slots</a>
            <th:block th:if="${currentUser != null and currentUser.customer}">
                <a th:href="@{/my/appointments}">My Appointments</a>
            </th:block>
            <th:block th:if="${currentUser != null and currentUser.provider}">
                <a th:href="@{/provider/slots}">My Slots</a>
                <a th:href="@{/provider/appointments}">Bookings</a>
            </th:block>
            <a th:if="${currentUser == null}" th:href="@{/login}">Log in</a>
            <form th:if="${currentUser != null}" class="logout" th:action="@{/logout}" method="post">
                <span class="who" th:text="${currentUser.fullName} + ' (' + ${#strings.toLowerCase(currentUser.role)} + ')'">Name</span>
                <button type="submit" class="link">Log out</button>
            </form>
        </nav>
    </div>
</header>
<div th:fragment="notice" th:if="${notice}" class="alert ok" th:text="${notice}">Done</div>
<footer th:fragment="footer" class="site-footer">
    <div class="wrap">TutorBook &middot; SJSU CMPE 172 Term Project &middot; Milestone 2</div>
</footer>
</body>
</html>
