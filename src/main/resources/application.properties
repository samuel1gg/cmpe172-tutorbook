spring.application.name=TutorBook

# --- Database (embedded H2; zero setup) --------------------------------
spring.datasource.url=jdbc:h2:mem:tutorbook;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# --- Run schema.sql then seed.sql on every startup ---------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

# --- H2 web console: http://localhost:8080/h2-console -------------------
spring.h2.console.enabled=true

# --- Actuator: /actuator/health and /actuator/metrics/{name} -------------
# Our own GET /health is in HealthController; custom metrics in MetricsConfig.
management.endpoints.web.exposure.include=health,info,metrics

# --- Notification service (Milestone 3) -----------------------------------
# Blank = the mock controller inside this app. Point it elsewhere to use a
# real service; nothing else changes.
notification.base-url=
notification.connect-timeout=1s
notification.read-timeout=1500ms
notification.max-attempts=3
notification.initial-backoff=200ms
# NotificationRetryJob resends FAILED notifications every retry-interval,
# until they are SENT or reach max-total-attempts (then GAVE_UP).
notification.retry-interval=60s
notification.max-total-attempts=12

# Mock service behaviour: UP, DOWN (503) or SLOW (waits slow-delay).
# Can also be changed at runtime: PUT /mock-notification-service/mode/DOWN
notification.mock.mode=UP
notification.mock.slow-delay=3s

# --- Logging ---------------------------------------------------------------
logging.level.edu.sjsu.cmpe172.tutorbook=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{0} - %msg%n

# --- Thymeleaf (disable cache so template edits show on refresh) --------
spring.thymeleaf.cache=false

# --- Never send stack traces or exception details to the client ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
